<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="源码图鉴吉祥物">
  <!-- 米白纸底 + 圆角，和站点丝网印刷绘本风一致 -->
  <rect width="64" height="64" rx="14" fill="#faf6ee"/>
  <!-- 天线耳 -->
  <g stroke="#1b5faa" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M23 17 L20 9"/>
    <path d="M41 17 L44 9"/>
  </g>
  <circle cx="20" cy="8.5" r="2.8" fill="#86d3c8" stroke="#1b5faa" stroke-width="2"/>
  <circle cx="44" cy="8.5" r="2.8" fill="#86d3c8" stroke="#1b5faa" stroke-width="2"/>
  <!-- 猫耳 -->
  <path d="M17 26 Q14 15 24 19 Z" fill="#2b9fe3" stroke="#1b5faa" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M47 26 Q50 15 40 19 Z" fill="#2b9fe3" stroke="#1b5faa" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 圆头 -->
  <path d="M32 17 Q49 17 50 33 Q51 47 32 47 Q13 47 14 33 Q15 17 32 17 Z" fill="#2b9fe3" stroke="#1b5faa" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- 眼睛与腮红 -->
  <ellipse cx="25" cy="31" rx="2.9" ry="3.4" fill="#1b3a5c"/>
  <ellipse cx="39" cy="31" rx="2.9" ry="3.4" fill="#1b3a5c"/>
  <circle cx="25.9" cy="29.8" r="1" fill="#faf6ee"/>
  <circle cx="39.9" cy="29.8" r="1" fill="#faf6ee"/>
  <ellipse cx="19.5" cy="36" rx="3" ry="1.9" fill="#86d3c8" opacity="0.65"/>
  <ellipse cx="44.5" cy="36" rx="3" ry="1.9" fill="#86d3c8" opacity="0.65"/>
  <!-- 鼻与微笑 -->
  <ellipse cx="32" cy="36.5" rx="2.1" ry="1.6" fill="#1b3a5c"/>
  <path d="M27.5 40.5 Q32 44 36.5 40.5" fill="none" stroke="#1b3a5c" stroke-width="2.1" stroke-linecap="round"/>
  <!-- 橙色围巾 -->
  <path d="M15 46 Q32 53 49 46 Q49 53 32 57 Q15 53 15 46 Z" fill="#ff8c42" stroke="#1b5faa" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
